<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administração de preços · MacWatts</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#223652;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:0 auto;padding:36px 20px}h1{margin:0 0 8px;font-size:30px}.sub{color:#68798d;margin-bottom:28px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 25px #22365212}.login{max-width:420px;margin:80px auto}.row{display:grid;grid-template-columns:1.2fr 1.6fr 1.2fr 150px 100px;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid #e8edf1}.head{font-size:12px;text-transform:uppercase;color:#718094;font-weight:700}.category{font-weight:700}.muted{color:#718094;font-size:13px}.price{width:110px;padding:9px;border:1px solid #ccd6df;border-radius:8px;font-size:15px}.btn{border:0;border-radius:8px;padding:10px 14px;background:#08bd79;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.btn.secondary{background:#223652}.message{margin:14px 0;color:#b34646}.ok{color:#13825e}@media(max-width:800px){.row{grid-template-columns:1fr 1fr}.head{display:none}}
  </style>
</head>
<body><main class="wrap">
  <section id="login" class="card login"><h1>Preços MacWatts</h1><p class="sub">Área reservada para atualizar os preços das propostas.</p><input id="password" type="password" placeholder="Palavra-passe" autocomplete="current-password" style="width:100%;padding:12px;border:1px solid #ccd6df;border-radius:8px"><button id="loginBtn" class="btn" style="margin-top:12px;width:100%">Entrar</button><p id="loginMessage" class="message"></p></section>
  <section id="panel" hidden><h1>Gestão de preços</h1><p class="sub">Altera um valor e guarda apenas essa linha. Os preços são aplicados às novas propostas.</p><div class="card"><div class="row head"><div>Tipo</div><div>Item</div><div>Gama</div><div>Preço (€)</div><div></div></div><div id="rows"></div><p id="message" class="message"></p></div></section>
</main><script src="/config.js"></script><script>
const api=(window.MACWATTS_CONFIG?.apiBaseUrl||'').replace(/\/$/,'');let password='';
const $=id=>document.getElementById(id);function msg(text,ok=false){$('message').textContent=text;$('message').className=ok?'message ok':'message'}
async function load(){const r=await fetch(api+'/api/admin/prices',{headers:{'X-Admin-Password':password}});if(!r.ok)throw new Error(await r.text());const data=await r.json();$('rows').innerHTML=data.map(row=>`<div class="row"><div class="category">${esc(row.category)}</div><div>${esc(row.label)}</div><div class="muted">${esc(row.gama)}</div><div><input class="price" type="number" min="0" step="0.01" value="${row.price}" data-table="${row.table}" data-id="${row.id}"></div><button class="btn secondary save">Guardar</button></div>`).join('');document.querySelectorAll('.save').forEach(b=>b.onclick=save)}
async function save(e){const input=e.target.closest('.row').querySelector('.price');e.target.disabled=true;try{const r=await fetch(api+'/api/admin/prices',{method:'PATCH',headers:{'Content-Type':'application/json','X-Admin-Password':password},body:JSON.stringify({table:input.dataset.table,id:input.dataset.id,price:input.value})});if(!r.ok)throw new Error(await r.text());msg('Preço guardado com sucesso.',true)}catch(x){msg(x.message)}finally{e.target.disabled=false}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function login(){password=$('password').value;try{await load();$('login').hidden=true;$('panel').hidden=false}catch(e){$('loginMessage').textContent=e.message;password=''}}$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};
</script></body></html>
