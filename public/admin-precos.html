<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administração de preços · MacWatts</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#223652;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:0 auto;padding:36px 20px}h1{margin:0 0 8px;font-size:30px}.sub{color:#68798d;margin-bottom:28px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 25px #22365212}.login{max-width:420px;margin:80px auto}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{border:1px solid #ccd6df;background:#fff;color:#223652;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}.tab.active{background:#223652;color:#fff;border-color:#223652}.row{display:grid;grid-template-columns:1.2fr 1.6fr 1.2fr 150px 100px;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid #e8edf1}.head{font-size:12px;text-transform:uppercase;color:#718094;font-weight:700}.category{font-weight:700}.muted{color:#718094;font-size:13px}.price{width:110px;padding:9px;border:1px solid #ccd6df;border-radius:8px;font-size:15px}.btn{border:0;border-radius:8px;padding:10px 14px;background:#08bd79;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.btn.secondary{background:#223652}.message{margin:14px 0;color:#b34646}.ok{color:#13825e}@media(max-width:800px){.row{grid-template-columns:1fr 1fr}.head{display:none}.tabs{flex-wrap:wrap}}
    .row.with-inverter{grid-template-columns:1.2fr 1.35fr 1.35fr 1.2fr 150px 100px}.inverter{width:100%;padding:9px;border:1px solid #ccd6df;border-radius:8px;font-size:15px}@media(max-width:800px){.row,.row.with-inverter{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body><main class="wrap">
  <section id="login" class="card login"><h1>Preços MacWatts</h1><p class="sub">Área reservada para atualizar os preços das propostas.</p><input id="password" type="password" placeholder="Palavra-passe" autocomplete="current-password" style="width:100%;padding:12px;border:1px solid #ccd6df;border-radius:8px"><button id="loginBtn" class="btn" style="margin-top:12px;width:100%">Entrar</button><p id="loginMessage" class="message"></p></section>
  <section id="panel" hidden><h1>Gestão de preços</h1><p class="sub">Altera os valores e guarda todas as alterações da aba de uma vez.</p><div class="tabs"><button class="tab active" data-category="Painéis / configuração">Painéis</button><button class="tab" data-category="Bateria">Baterias</button><button class="tab" data-category="Backup">Backup</button><button id="saveAll" class="btn" style="margin-left:auto">Guardar alterações</button></div><div class="card"><div class="row head"><div>Tipo</div><div>Item</div><div>Gama</div><div>Preço (€)</div><div></div></div><div id="rows"></div><p id="message" class="message"></p></div></section>
</main><script src="/config.js"></script><script>
const api=(window.MACWATTS_CONFIG?.apiBaseUrl||'').replace(/\/$/,'');let password='',allRows=[],activeCategory='Painéis / configuração';
const $=id=>document.getElementById(id);function msg(text,ok=false){$('message').textContent=text;$('message').className=ok?'message ok':'message'}
async function adminRequest(body){return fetch(api+'/api/admin/prices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,password})})}
async function load(){const r=await adminRequest({action:'list'});if(!r.ok)throw new Error(await r.text());allRows=await r.json();renderRows()}
function renderRows(){const data=allRows.filter(row=>row.category===activeCategory);$('rows').innerHTML=data.map(row=>`<div class="row"><div class="category">${esc(row.category)}</div><div>${esc(row.label)}</div><div class="muted">${esc(row.gama)}</div><div><input class="price" type="number" min="0" step="0.01" value="${row.price}" data-original="${row.price}" data-table="${row.table}" data-id="${row.id}"></div><button class="btn secondary save">Guardar</button></div>`).join('');document.querySelectorAll('.save').forEach(b=>b.onclick=save)}
async function update(input){const r=await adminRequest({table:input.dataset.table,id:input.dataset.id,price:input.value});if(!r.ok)throw new Error(await r.text())}
async function save(e){const input=e.target.closest('.row').querySelector('.price');e.target.disabled=true;try{await update(input);input.dataset.original=input.value;msg('Preço guardado com sucesso.',true)}catch(x){msg(x.message)}finally{e.target.disabled=false}}
async function saveAll(){const button=$('saveAll'),inputs=[...document.querySelectorAll('.price')].filter(input=>input.dataset.original!==input.value);if(!inputs.length){msg('Não existem alterações por guardar.',true);return}button.disabled=true;try{await Promise.all(inputs.map(update));inputs.forEach(input=>input.dataset.original=input.value);msg(`${inputs.length} alteração(ões) guardada(s) com sucesso.`,true)}catch(x){msg(x.message)}finally{button.disabled=false}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function login(){password=$('password').value;try{await load();$('login').hidden=true;$('panel').hidden=false}catch(e){$('loginMessage').textContent=e.message;password=''}}$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('saveAll').onclick=saveAll;document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{activeCategory=tab.dataset.category;document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===tab));renderRows()});
function renderRows(){const data=allRows.filter(row=>row.category===activeCategory);$('rows').innerHTML=data.map(row=>`<div class="row"><div class="category">${esc(row.category)}</div><div>${esc(row.label)}${row.inverter!==undefined?`<input class="inverter" type="text" value="${esc(row.inverter)}" data-original="${esc(row.inverter)}" data-id="${row.configId}" placeholder="Inversor">`:''}</div><div class="muted">${esc(row.gama)}</div><div><input class="price" type="number" min="0" step="0.01" value="${row.price}" data-original="${row.price}" data-table="${row.table}" data-id="${row.id}"></div><button class="btn secondary save">Guardar</button></div>`).join('');document.querySelectorAll('.save').forEach(b=>b.onclick=save)}
async function save(e){const row=e.target.closest('.row'),input=row.querySelector('.price'),inverter=row.querySelector('.inverter');e.target.disabled=true;try{await update(input);if(inverter&&inverter.dataset.original!==inverter.value){const r=await adminRequest({field:'inverter',id:inverter.dataset.id,value:inverter.value});if(!r.ok)throw new Error(await r.text());inverter.dataset.original=inverter.value}input.dataset.original=input.value;msg('Alterações guardadas com sucesso.',true)}catch(x){msg(x.message)}finally{e.target.disabled=false}}
renderRows=function(){const data=allRows.filter(row=>row.category===activeCategory);document.querySelector('.head').innerHTML='<div>Tipo</div><div>Item</div><div>Inversor</div><div>Gama</div><div>Preço (€)</div><div></div>';$('rows').innerHTML=data.map(row=>`<div class="row"><div class="category">${esc(row.category)}</div><div>${esc(row.label)}</div><div>${row.inverter!==undefined?`<input class="inverter" type="text" value="${esc(row.inverter)}" data-original="${esc(row.inverter)}" data-id="${row.configId}" placeholder="Inversor">`:''}</div><div class="muted">${esc(row.gama)}</div><div><input class="price" type="number" min="0" step="0.01" value="${row.price}" data-original="${row.price}" data-table="${row.table}" data-id="${row.id}"></div><button class="btn secondary save">Guardar</button></div>`).join('');document.querySelectorAll('.save').forEach(b=>b.onclick=save)};
function normalizeInverterColumn(){const panelRows=allRows.filter(row=>row.category===activeCategory),hasInverter=panelRows.some(row=>row.inverter!==undefined),head=document.querySelector('.head');head.classList.toggle('with-inverter',hasInverter);head.children[2].hidden=!hasInverter;document.querySelectorAll('#rows .row').forEach(row=>{row.classList.toggle('with-inverter',hasInverter);if(row.children[2])row.children[2].hidden=!hasInverter})}new MutationObserver(normalizeInverterColumn).observe($('rows'),{childList:true});
const flyerButton=document.createElement('button');flyerButton.type='button';flyerButton.className='btn secondary';flyerButton.textContent='Gerar flyer / PDF';flyerButton.onclick=()=>window.open('/flyer/index.html?print=1','_blank','noopener');document.getElementById('saveAll').insertAdjacentElement('afterend',flyerButton);
</script></body></html>
