<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    :root{--navy:#18324d;--deep:#10243a;--green:#18c08f;--mint:#eaf8f3;--pale:#f2f6f9;--line:#dde6ec;--text:#16293d;--mid:#55687a}
    *{box-sizing:border-box}html,body{margin:0;background:#f5f4ef;color:var(--text);font-family:Manrope,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}body{padding:24px 0}#app{display:flex;flex-direction:column;align-items:center;gap:24px}.page{width:210mm;height:297mm;position:relative;overflow:hidden;background:#fff;box-shadow:0 1px 8px #1b33401c}.page:not(.cover-page){padding:10.58mm 12.7mm 0}
    .header{display:flex;justify-content:space-between;align-items:center;padding-bottom:4.2mm;border-bottom:1px solid var(--line)}.logo-wrap{width:40mm;height:7mm;overflow:hidden}.logo-wrap img{display:block;width:49.5mm;height:auto;margin:-10mm 0 0 -4.8mm}.header-copy{text-align:right}.tagline{font-size:9.75pt;font-weight:700;color:var(--navy)}.page-no{font-size:9pt;font-weight:600;color:#6b7b8b;margin-top:1mm}.footer{position:absolute;left:12.7mm;right:12.7mm;bottom:8.5mm;padding-top:3.7mm;border-top:1px solid var(--line);display:flex;justify-content:center;gap:7.4mm;font-size:9.75pt;font-weight:600;color:var(--mid)}
    .cover-page{background:var(--deep);color:#fff}.cover-hero{position:absolute;inset:0 0 32.2% 0}.cover-hero>img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}.cover-top{position:absolute;left:12.7mm;right:12.7mm;top:10.6mm;display:flex;justify-content:space-between;align-items:center}.cover-logo{width:42mm;height:9mm;background:#fff;border-radius:99px;padding:3mm 5.8mm;object-fit:contain}.cover-pill{border:1.5px solid #ffffffbf;border-radius:99px;padding:2.6mm 4.8mm;font-size:9.75pt;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.cover-copy{position:absolute;left:12.7mm;top:33.3mm;width:145mm}.cover-question{margin:0 0 4.2mm;font-size:13.5pt;font-weight:700;color:#cdeeff}.cover-copy .save-label{font-size:22.5pt;font-weight:600;line-height:1}.cover-copy .save-number{font-size:117pt;font-weight:800;line-height:.95;letter-spacing:-.045em}.cover-copy .save-number span{color:#3ee0ac}.cover-copy .save-text{font-size:22.5pt;font-weight:600;line-height:1.15;margin-top:1.6mm}.finance-card{position:absolute;right:12.7mm;top:162mm;width:69.3mm;background:#fff;color:var(--deep);border-radius:4.8mm;padding:4.2mm 4.8mm;display:flex;gap:3.7mm;align-items:flex-start}.finance-icon{width:10.6mm;height:10.6mm;flex:none;border-radius:3.2mm;background:var(--mint);display:grid;place-items:center;color:#0e7a5c;font-size:16pt}.finance-card strong{font-size:11.3pt;line-height:1.25}.finance-card small{display:block;font-size:9pt;font-weight:600;color:var(--mid);margin-top:1mm;line-height:1.35}.cover-bottom{position:absolute;left:0;right:0;bottom:0;height:32.2%;padding:9mm 12.7mm 9.5mm;display:flex;flex-direction:column;gap:5.8mm;background:var(--deep)}.cover-bottom h2{margin:0;font-size:18pt;line-height:1.2}.cover-bottom h2 span{color:#3ee0ac}.benefits{display:grid;grid-template-columns:1fr 1fr;gap:3.2mm 7.4mm}.benefit{display:flex;gap:3.2mm;align-items:center;font-size:11.25pt;font-weight:600;color:#e6eef5}.check{width:6.4mm;height:6.4mm;flex:none;border-radius:50%;background:var(--green);display:grid;place-items:center;color:var(--deep);font-weight:900}.brands-bar{background:#fff;color:var(--deep);border-radius:4.2mm;padding:3.7mm 5.8mm;display:flex;align-items:center;gap:4.8mm}.brands-label{width:24mm;flex:none;font-size:9pt;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#0e7a5c;line-height:1.3}.brands{flex:1;display:flex;justify-content:space-between;align-items:center;gap:4mm}.brands img{max-width:18mm;height:8.5mm;object-fit:contain}.cover-footer{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:9.75pt;font-weight:600;color:#b9c8d6}.contact{display:flex;gap:6.4mm}.print-actions{position:fixed;right:18px;bottom:18px;z-index:50}.print-button{border:0;border-radius:8px;padding:11px 16px;background:var(--navy);color:#fff;font:700 13px inherit;cursor:pointer;box-shadow:0 4px 14px #19304633}
    .intro{margin-top:6.9mm;display:flex;justify-content:space-between;align-items:flex-end}.kicker{font-size:9pt;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#0e7a5c}.title{margin:1.6mm 0 0;font-size:31.5pt;font-weight:800;line-height:1.05;letter-spacing:-.02em;color:var(--deep)}.subtitle{margin-top:2.1mm;font-size:10.5pt;font-weight:600;color:var(--mid)}.vat{background:var(--mint);color:#0e7a5c;border-radius:99px;padding:2.1mm 3.7mm;font-size:9pt;font-weight:800;white-space:nowrap}.pricing{margin-top:5.3mm;border:1px solid var(--line);border-radius:3.7mm;overflow:hidden;font-size:9pt;font-variant-numeric:tabular-nums}.grid{display:grid;grid-template-columns:15.3mm 15.3mm 18.5mm repeat(6,minmax(0,1fr))}.group{height:7.9mm;font-size:8.3pt;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.group>div,.sub>div{display:flex;align-items:center;justify-content:center}.group .config-head{grid-column:span 3;background:var(--mint);color:#0e7a5c}.group .mono{grid-column:span 3;background:var(--navy);color:#fff}.group .tri{grid-column:span 3;background:var(--deep);color:#fff;border-left:1px solid #2c4560}.sub{height:7.4mm;background:var(--pale);font-size:8.3pt;font-weight:800;color:#3b4f63}.sub>div{padding:0 2.6mm;justify-content:flex-end}.sub>div:nth-child(-n+3){justify-content:center}.sub>div:nth-child(4),.sub>div:nth-child(7){border-left:1px solid #d3dee5}.data-row{height:7.7mm;border-top:1px solid #e3eaef}.data-row>div{display:flex;align-items:center;justify-content:flex-end;padding:0 2.6mm;font-weight:600}.data-row>div:nth-child(-n+3){justify-content:center;color:var(--deep);font-weight:800}.data-row>div:nth-child(4),.data-row>div:nth-child(7){border-left:1px solid #e3eaef}.data-row>div:nth-child(even){background:#fbfcfd}.data-row .dash{color:#7a8896}.included{color:#0e7a5c!important;font-weight:800!important}.equipment-grid{margin-top:5.3mm;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3.2mm}.equipment{background:var(--pale);border-radius:4.2mm;padding:4.2mm 3.7mm;display:flex;flex-direction:column;gap:2.6mm}.eq-image{height:23.3mm;display:flex;align-items:center;justify-content:center}.eq-image img{max-width:100%;max-height:100%;object-fit:contain}.eq-title{font-size:9pt;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--deep);line-height:1.3;min-height:8.5mm}.eq-bullets{display:flex;flex-direction:column;gap:1.6mm}.eq-bullet{display:flex;gap:1.9mm;align-items:flex-start;font-size:9pt;font-weight:600;color:#3b4f63;line-height:1.35}.eq-bullet .mini-check{color:#12a87b;font-weight:900;flex:none}.certs{margin-top:4.2mm;display:grid;grid-template-columns:1fr 1fr;gap:3.2mm}.cert{height:10.6mm;border-radius:99px;display:flex;align-items:center;justify-content:center;gap:2.1mm;font-size:9.75pt;font-weight:800}.cert:first-child{background:var(--mint);color:#0e7a5c}.cert:last-child{background:#edf2f6;color:var(--navy)}
    .tesla-config-title{margin-top:6.9mm;font-size:9pt;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mid)}.tesla-cards{margin-top:3.2mm;display:grid;grid-template-columns:1fr 1fr;gap:4.2mm}.tesla-card{border-radius:5.3mm;padding:6.9mm;background:var(--pale);display:flex;flex-direction:column;gap:3.7mm}.tesla-card.dark{background:var(--deep);color:#fff}.tesla-card-head{display:flex;justify-content:space-between;align-items:baseline}.tesla-panels{font-size:22.5pt;font-weight:800;letter-spacing:-.02em}.tesla-meta{font-size:9.75pt;font-weight:700;color:var(--mid)}.dark .tesla-meta{color:#b9c8d6}.tesla-rule{height:1px;background:#d6e0e7}.dark .tesla-rule{background:#2c4560}.tesla-label{font-size:9pt;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mid)}.dark .tesla-label{color:#b9c8d6}.tesla-price-input{width:100%;border:0;background:transparent;color:inherit;font:800 30pt Sora,Manrope,sans-serif;letter-spacing:-.02em;padding:0;outline:0}.tesla-price-input.small{font:700 10.5pt Manrope,sans-serif;text-align:right}.tesla-price-input:focus{outline:1px solid var(--green);border-radius:3px;background:#fff;color:var(--deep)}.tesla-backup{align-self:flex-start;background:var(--green);color:var(--deep);border-radius:99px;padding:2.1mm 3.7mm;font-size:9.75pt;font-weight:800}.tesla-equipment{margin-top:6.4mm;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3.2mm}.tesla-equipment .equipment{padding:4.8mm}.tesla-equipment .eq-image{height:31.7mm}.tesla-equipment .eq-title{font-size:9.75pt}.tesla-equipment .eq-bullet{font-size:9.75pt}
    .conditions-intro{margin-top:6.9mm}.condition-stack{margin-top:5.3mm}.condition-card{background:var(--pale);border-radius:4.2mm;padding:5.3mm 6.4mm}.condition-card+.condition-card{margin-top:3.7mm}.condition-card h2{margin:0 0 2.6mm;font-size:9pt;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#0e7a5c}.condition-list{display:flex;flex-direction:column;gap:1.6mm;font-size:9.75pt;font-weight:500;line-height:1.4;color:#2a3e52}.condition-item{display:flex;gap:2.6mm;align-items:flex-start}.dot{width:1.6mm;height:1.6mm;flex:none;border-radius:50%;background:var(--green);margin-top:2.3mm}.payment{margin-top:3.7mm}.payment-title{margin:0 0 2.6mm;font-size:9pt;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#0e7a5c}.payment-grid{display:grid;grid-template-columns:1fr 1fr;gap:3.2mm}.payment-card{border:1.5px solid var(--line);border-radius:4.2mm;padding:4.8mm 5.3mm}.payment-card.green{border:0;background:var(--mint)}.payment-card h3{margin:0;font-size:13.5pt;font-weight:700;color:var(--deep)}.payment-line{margin-top:2.6mm;display:flex;gap:2.6mm;align-items:baseline;font-size:9.75pt;font-weight:600;color:#3b4f63}.payment-line strong{font-size:19.5pt;color:#0e7a5c}.contact-card{margin-top:4.2mm;background:var(--deep);color:#fff;border-radius:5.3mm;padding:5.8mm 6.9mm;display:flex;justify-content:space-between;align-items:center;gap:5.3mm}.contact-card h2{margin:0;font-size:16.5pt}.contact-card p{margin:1mm 0 0;font-size:9.75pt;color:#b9c8d6}.contact-info{text-align:right;font-size:11.25pt;font-weight:700}.contact-info strong{display:block;font-size:15pt;color:#3ee0ac;margin-bottom:1mm}
    @media screen and (max-width:900px){body{padding:0;background:#fff}.page{box-shadow:none;margin:0 auto}.page:not(:last-child){margin-bottom:12px}}@media print{@page{size:A4 portrait;margin:0}html,body{background:#fff}body{padding:0}#app{display:block}.page{box-shadow:none;margin:0;break-after:page;page-break-after:always}.page:last-child{break-after:auto;page-break-after:auto}.print-actions{display:none}.tesla-price-input{border:0!important;background:transparent!important}}
    /* Ajustes do novo template: logos das marcas e logo da MacWatts na capa. */
    .cover-logo-box{width:42mm;height:9mm;background:#fff;border-radius:99px;overflow:hidden;display:flex;align-items:center;padding:0 5.8mm;flex:none}.cover-logo-box img{display:block;width:49.5mm;height:auto;max-width:none;margin:-10mm 0 0 -4.8mm}.equipment{position:relative;overflow:hidden}.equipment-brand{width:18mm;height:6mm;object-fit:contain;align-self:flex-end;margin-top:auto}
    /* Cores das tabelas conforme o novo modelo do flyer. */
    .pricing .group .config-head{background:#e8f7f2;color:#0e7a5c}.pricing .group .mono{background:#18324d;color:#fff}.pricing .group .tri{background:#10243a;color:#fff}.pricing .sub{background:#edf2f6;color:#3b4f63}.pricing .data-row>div:nth-child(-n+3){background:#eef9f6}.pricing .data-row>div:nth-child(n+4){background:#fff}.pricing .data-row:nth-child(even)>div:nth-child(-n+3){background:#dff3ed}.pricing .data-row:nth-child(even)>div:nth-child(n+4){background:#f2f6f9}
    /* Os logótipos passam a ocupar toda a barra dos fabricantes. */
    .brands-bar{gap:0;padding-left:5.8mm;padding-right:5.8mm}.brands-bar .brands-label{display:none}.brands-bar .brands{width:100%;gap:4mm}.brands-bar .brands img{max-width:30mm;height:15mm}.equipment-brand{width:22mm;height:7mm}
    .cover-logo-box img{width:38mm;margin:-4.8mm 0 0 -3.7mm}
    .tesla-card.dark div[style*="grid-template-columns"]{min-width:0}.tesla-card.dark div[style*="grid-template-columns"]>div{min-width:0;overflow:hidden}.tesla-card.dark .tesla-price-input{min-width:0;width:100%;font-size:25pt;letter-spacing:-.04em;white-space:nowrap}

<body>
  <div id="app"></div><div class="print-actions"><button id="printPdf" class="print-button" type="button">Guardar / imprimir PDF</button></div>
  <script src="../config.js"></script><script>window.FLYER_DATA_URL=`${window.MACWATTS_CONFIG?.apiBaseUrl||''}/api/flyer`;</script><script src="flyer-data.js"></script>
  <script>
    const ASSET=name=>`assets/${name}`;const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const PRODUCT_INFO={base:'Painéis N-Type TOPCon · Inversor e bateria FOX',premium:'Painéis N-Type TOPCon · Inversor e bateria Huawei','premium-all-black':'Painéis All-Black · Inversor e bateria Huawei',tesla:'Painéis All-Black · Tesla Powerwall, inversor e bateria All-in-One'};
    function formatEuroText(value){const raw=String(value??'').trim();const digits=raw.match(/-?\d[\d\s.,]*/)?.[0]?.replace(/[\s.,]/g,'');if(!digits)return value;return `${digits.replace(/\B(?=(\d{3})+(?!\d))/g,' ')} €`;};function formatPriceCell(value){return /\d/.test(String(value??''))?formatEuroText(value):value;}
    function header(data,no){return `<header class="header"><div class="logo-wrap"><img src="${ASSET('logo.png')}" alt="MacWatts"></div><div class="header-copy"><div class="tagline">${esc(data.meta.tagline)}</div><div class="page-no">${no} / 06</div></div></header>`}function footer(data){return `<footer class="footer"><span>${esc(data.meta.website)}</span><span>${esc(data.meta.email)}</span><span>${esc(data.meta.phone)}</span></footer>`}
    function check(text){return `<div class="benefit"><span class="check">✓</span><span>${esc(text)}</span></div>`}function coverPage(data){const c=data.cover;return `<section class="page cover-page"><div class="cover-hero"><img src="${ASSET('hero.png')}" alt="Casa com painéis solares"><div class="cover-top"><img class="cover-logo" src="${ASSET('logo.png')}" alt="MacWatts"><div class="cover-pill">Kit Solar Residencial</div></div><div class="cover-copy"><p class="cover-question">${esc(data.meta.tagline)}</p><div class="save-label">${esc(c.savingsPrefix)}</div><div class="save-number">${esc(c.savings).replace('%','')}<span>%</span></div><div class="save-text">na sua fatura<br>de eletricidade</div></div><div class="finance-card"><div class="finance-icon">▣</div><div><strong>${esc(c.financing)}</strong><small>Crédito de 24 a 120 meses com taxa de juro fixa</small></div></div></div><div class="cover-bottom"><h2>Solução completa com <span>armazenamento e backup</span></h2><div class="benefits">${c.benefits.map(check).join('')}</div><div class="brands-bar"><div class="brands-label">Principais fabricantes</div><div class="brands">${c.brands.map(x=>`<img src="${ASSET(x)}" alt="">`).join('')}</div></div><div class="cover-footer"><div class="contact"><span>${esc(data.meta.website)}</span><span>${esc(data.meta.email)}</span><span>${esc(data.meta.phone)}</span></div><span>01 / 06</span></div></div></section>`}
    function rowCells(row){return row.map((value,i)=>`<div class="${i<3?'config-cell':''} ${String(value).includes('INCLUÍDO')?'included':''} ${value==='--'?'dash':''}">${esc(i>=3?formatPriceCell(value):value)}</div>`).join('')}
    function pricingTable(product){return `<div class="pricing"><div class="grid group"><div class="config-head">Configuração</div><div class="mono">Monofásico</div><div class="tri">Trifásico</div></div><div class="grid sub"><div>Painéis</div><div>kWp</div><div>Bat. kWh</div><div>Kit fotov.</div><div>Bateria</div><div>Backup</div><div>Kit fotov.</div><div>Bateria</div><div>Backup</div></div>${product.rows.map(row=>`<div class="grid data-row">${rowCells(row)}</div>`).join('')}</div>`}
    function equipmentCard(eq){return `<article class="equipment"><div class="eq-image"><img src="${ASSET(eq.image)}" alt="${esc(eq.title)}"></div><div class="eq-title">${esc(eq.title)}</div><div class="eq-bullets">${eq.bullets.filter(b=>b!=='--').map(b=>`<div class="eq-bullet"><span class="mini-check">✓</span><span>${esc(b)}</span></div>`).join('')}</div></article>`}function certs(){return `<div class="certs"><div class="cert">✓ Instalação por Equipa Técnica Certificada</div><div class="cert">▧ Registo da Instalação na DGEG</div></div>`}
    function productPage(data,p,no){return `<section class="page"><div>${header(data,no)}<div class="intro"><div><div class="kicker">Gama ${no-1} de 04</div><h1 class="title">${esc(p.title)}</h1><div class="subtitle">${esc(PRODUCT_INFO[p.slug]||'Solução fotovoltaica MacWatts')}</div></div><div class="vat">Preços PVP com IVA</div></div>${pricingTable(p)}<div class="equipment-grid">${p.equipment.map(equipmentCard).join('')}</div>${certs()}</div>${footer(data)}</section>`}
    function savedTesla(){try{return JSON.parse(localStorage.getItem('macwatts-tesla-prices')||'{}')}catch(e){return {}}}function teslaInput(value,key,small=false){const saved=savedTesla();return `<input class="tesla-price-input${small?' small':''}" data-tesla-key="${esc(key)}" value="${esc(saved[key]||formatPriceCell(value))}" aria-label="Preço Tesla">`}
    function teslaPage(data,p,no){const rows=p.rows||[],r12=rows.find(r=>Array.isArray(r.config)&&String(r.config[0])==='12')||{},r26=rows.find(r=>Array.isArray(r.config)&&String(r.config[0])==='26')||{};return `<section class="page"><div>${header(data,no)}<div class="intro"><div><div class="kicker">Gama 04 de 04</div><h1 class="title">Tesla All-Black</h1><div class="subtitle">${esc(PRODUCT_INFO.tesla)}</div></div><div class="vat">Preços PVP com IVA</div></div><div class="tesla-config-title">Configurações disponíveis · Kit fotovoltaico + Powerwall</div><div class="tesla-cards"><article class="tesla-card"><div class="tesla-card-head"><div class="tesla-panels">12 painéis</div><div class="tesla-meta">6,4 kWp · 10 kWh</div></div><div class="tesla-rule"></div><div><div class="tesla-label">Monofásico</div>${teslaInput(r12.monoBundle,'monoBundle-12')}</div><div class="payment-line"><span>Backup</span>${teslaInput(r12.monoBackup,'monoBackup-12',true)}</div><div class="payment-line" style="color:#7a8896"><span>Trifásico</span><span>—</span></div></article><article class="tesla-card dark"><div class="tesla-card-head"><div class="tesla-panels">26 painéis</div><div class="tesla-meta">13,8 kWp · 25 kWh</div></div><div class="tesla-rule"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:3.2mm"><div><div class="tesla-label">Monofásico</div>${teslaInput(r26.monoBundle,'monoBundle-26')}</div><div><div class="tesla-label">Trifásico</div>${teslaInput(r26.triBundle,'triBundle-26')}</div></div><div class="tesla-backup">✓ Backup incluído</div></article></div><div class="tesla-equipment">${p.equipment.map(equipmentCard).join('')}</div>${certs()}</div>${footer(data)}</section>`}
    function conditionsPage(data){return `<section class="page"><div>${header(data,6)}<div class="conditions-intro"><div class="kicker">Condições</div><h1 class="title" style="font-size:27pt">Condições comerciais e técnicas</h1></div><div class="condition-stack">${data.conditions.slice(0,2).map(sec=>`<article class="condition-card"><h2>${esc(sec.title)}</h2><div class="condition-list">${sec.items.map(i=>`<div class="condition-item"><span class="dot"></span><span>${esc(i)}</span></div>`).join('')}</div></article>`).join('')}<div class="payment"><h2 class="payment-title">Condições de pagamento</h2><div class="payment-grid"><div class="payment-card"><h3>Pronto pagamento</h3><div class="payment-line"><strong>50%</strong><span>com a adjudicação</span></div><div class="payment-line"><strong>50%</strong><span>com a conclusão da instalação</span></div></div><div class="payment-card green"><h3>Pagamento a crédito</h3><div class="payment-line"><strong>24 a 120 meses</strong></div><div class="payment-line">com taxa de juro fixa</div></div></div></div><div class="contact-card"><div><h2>Fale connosco</h2><p>Encontramos o kit certo para a sua casa.</p></div><div class="contact-info"><strong>${esc(data.meta.phone)}</strong><span>${esc(data.meta.email)} · ${esc(data.meta.website)}</span></div></div></div></div>${footer(data)}</section>`}
    function setupTeslaInputs(){document.querySelectorAll('.tesla-price-input').forEach(input=>input.addEventListener('blur',()=>{const value=formatPriceCell(input.value);input.value=value;const saved=savedTesla();saved[input.dataset.teslaKey]=value;localStorage.setItem('macwatts-tesla-prices',JSON.stringify(saved))}))}function render(data){const pages=[coverPage(data)];data.products.filter(p=>!p.tesla).forEach((p,i)=>pages.push(productPage(data,p,i+2)));const tesla=data.products.find(p=>p.tesla);if(tesla)pages.push(teslaPage(data,tesla,5));pages.push(conditionsPage(data));document.getElementById('app').innerHTML=pages.join('');setupTeslaInputs()}
    async function boot(){let data=window.FLYER_DATA;if(window.FLYER_DATA_URL){const res=await fetch(window.FLYER_DATA_URL,{credentials:'same-origin'});if(!res.ok)throw new Error(`Erro a carregar dados: ${res.status}`);data=await res.json()}const fallbackTesla=window.FLYER_DATA?.products?.find(p=>p.tesla);const apiTesla=data.products?.find(p=>p.tesla);if(apiTesla&&(!Array.isArray(apiTesla.rows)||!apiTesla.rows.some(r=>Array.isArray(r.config))))apiTesla.rows=fallbackTesla?.rows||apiTesla.rows;render(data);document.getElementById('printPdf').onclick=()=>window.print()}boot().catch(err=>{console.error(err);document.body.innerHTML=`<pre style="padding:24px">${esc(err.message)}</pre>`});
  </script>
  <script>
    (() => {
      const updateFlyerLayout = () => {
        const logo = document.querySelector('.cover-logo');
        if (logo && !logo.closest('.cover-logo-box')) {
          const box = document.createElement('div');
          box.className = 'cover-logo-box';
          logo.className = '';
          logo.replaceWith(box);
          box.appendChild(logo);
        }

        document.querySelectorAll('.subtitle').forEach(element => element.remove());

        document.querySelectorAll('.equipment').forEach(card => {
          const title = card.querySelector('.eq-title')?.textContent.trim().toUpperCase() || '';
          if (title === 'SISTEMA TESLA') {
            card.remove();
            return;
          }
          const brand = title.includes('TESLA') ? 'tesla.png' : title.includes('HUAWEI') ? 'huawei.png' : title.includes('FOX') ? 'fox.png' : '';
          if (brand && !card.querySelector('.equipment-brand')) {
            const image = document.createElement('img');
            image.className = 'equipment-brand';
            image.src = `assets/${brand}`;
            image.alt = '';
            card.appendChild(image);
          }
        });
      };

      const app = document.getElementById('app');
      new MutationObserver(updateFlyerLayout).observe(app, { childList: true, subtree: true });
      updateFlyerLayout();
    })();
  </script>
</body>
